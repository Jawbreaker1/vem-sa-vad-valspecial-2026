<?xml version="1.0" encoding="UTF-8"?>
<!--
  Limits the AI-cleaned source to Socialdemokraterna's inner medallion surface.
  Every pixel outside this softly feathered circle comes from the original
  start-stage-clean.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <defs>
    <filter id="feather" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="1672" height="941" fill="#000"/>
  <g fill="#fff" filter="url(#feather)">
    <circle cx="141" cy="746" r="58"/>
  </g>
</svg>
